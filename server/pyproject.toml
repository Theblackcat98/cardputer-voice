[project]
name = "cardputer-voice-server"
version = "0.1.0"
description = "Companion server for the Cardputer voice client: STT -> llama.cpp -> TTS, plus host status"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "psutil>=6.0",
    "piper-tts>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
cardputer-voice-server = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
