<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOICE — Cardputer voice assistant mockup</title>
<style>
  :root{ --bg:#0a0c0d; --panel:#141719; --edge:#262b2e; --ink:#c6d2d5; --dim:#5e6b70; --cyan:#30dcff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",Menlo,monospace;
    min-height:100vh; display:grid; place-items:center; padding:36px 16px;
  }
  .rig{width:756px;max-width:100%}
  .pagehead{display:flex;justify-content:space-between;align-items:baseline;margin:0 3px 10px}
  .pagehead h1{font-size:12px;font-weight:600;letter-spacing:.22em;color:#95a5ab;text-transform:uppercase}
  .pagehead span{font-size:10px;letter-spacing:.14em;color:var(--dim)}

  .device{
    background:var(--panel); border:1px solid var(--edge); border-radius:14px;
    padding:16px 16px 10px; box-shadow:0 32px 70px -40px rgba(0,0,0,.95);
  }
  #lcd{
    display:block; width:720px; height:405px; background:#000;
    border:1px solid #2c3236; border-radius:3px;
    image-rendering:crisp-edges; image-rendering:pixelated;
    touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer;
  }
  .chin{display:flex;justify-content:space-between;margin:9px 3px 0;font-size:9px;letter-spacing:.26em;color:#525f63;text-transform:uppercase}

  .keys{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .krow{display:flex;gap:8px;flex-wrap:wrap}
  .k{
    flex:1 1 0; min-width:72px; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:9px 4px 8px; background:#181c1f; border:1px solid #2a3034; border-bottom-width:3px;
    border-radius:7px; color:var(--ink); cursor:pointer; font:inherit;
    transition:border-color .12s,background .12s,transform .05s;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .k:hover{border-color:#3b444a}
  .k:hover .lbl{color:#84969c}
  .k:active,.k.held{transform:translateY(2px);border-bottom-width:1px}
  .k .cap{font-size:12px;letter-spacing:.08em;color:#87989e}
  .k .lbl{font-size:9px;letter-spacing:.1em;color:#5e6b70;text-transform:uppercase;white-space:nowrap}
  .k.wide{flex:2.7 1 0}
  .k.on{background:#141c20;border-color:var(--k)}
  .k.on .cap{color:var(--k)}
  .k.on .lbl{color:#c9d5d8}
  .foot{margin-top:14px;text-align:center;font-size:10px;letter-spacing:.06em;color:#59666b;line-height:1.8}
  .foot b{color:#93a3a8;font-weight:600}
  @media (max-width:820px){
    .rig{width:100%}
    .device{padding:10px 10px 7px}
    #lcd{width:100%;height:auto;image-rendering:auto}
  }
</style>
</head>
<body>
<div class="rig">
  <div class="pagehead">
    <h1>voice / cardputer</h1>
    <span>240 &times; 135 &rarr; 3&times;</span>
  </div>

  <div class="device">
    <canvas id="lcd" width="240" height="135"></canvas>
    <div class="chin"><span>m5stack cardputer</span><span>st7789v2 &middot; 240&times;135</span></div>
  </div>

  <div class="keys">
    <div class="krow">
      <button class="k wide" id="bSpace" style="--k:#30dcff"><span class="cap">SPACE</span><span class="lbl">hold to talk</span></button>
      <button class="k" data-state="idle"   style="--k:#7f8b90"><span class="cap">1</span><span class="lbl">idle</span></button>
      <button class="k" data-state="listen" style="--k:#ff5347"><span class="cap">2</span><span class="lbl">listen</span></button>
      <button class="k" data-state="think"  style="--k:#30dcff"><span class="cap">3</span><span class="lbl">think</span></button>
      <button class="k" data-state="speak"  style="--k:#38d973"><span class="cap">4</span><span class="lbl">speak</span></button>
      <button class="k" data-state="error"  style="--k:#ff5347"><span class="cap">5</span><span class="lbl">error</span></button>
    </div>
    <div class="krow">
      <button class="k" data-face="robot" style="--k:#30dcff"><span class="cap">R</span><span class="lbl">robot</span></button>
      <button class="k" data-face="blob"  style="--k:#30dcff"><span class="cap">B</span><span class="lbl">blob</span></button>
      <button class="k" data-face="pixel" style="--k:#30dcff"><span class="cap">P</span><span class="lbl">pixel cat</span></button>
      <button class="k wide" id="bNext" style="--k:#38d973"><span class="cap">N</span><span class="lbl">next line</span></button>
    </div>
  </div>

  <p class="foot">
    <b>hold SPACE</b> (or hold the screen) to record &middot; <b>1&ndash;5</b> jump to a state &middot; <b>R/B/P</b> swap the avatar &middot; <b>N</b> next line<br>
    every pixel is laid out on a true 240&times;135 canvas &mdash; nothing here would not fit the real panel
  </p>
</div>

<script>
(() => {
"use strict";

/* ================================================================
   1. 5x8 BITMAP FONT  (chars are 5px wide + 1px gap = 40 columns
       on 240px; at 2x scale = 20 columns, like the real theme).
       Each glyph = 8 rows x 5 bits. Porting: this table becomes a
       const uint8_t[][5] and txt() becomes fillRect() per set bit.
   ================================================================ */
const FONT = {
 A:"01110 10001 10001 11111 10001 10001 10001 00000",
 B:"11110 10001 10001 11110 10001 10001 11110 00000",
 C:"01110 10001 10000 10000 10000 10001 01110 00000",
 D:"11110 10001 10001 10001 10001 10001 11110 00000",
 E:"11111 10000 10000 11110 10000 10000 11111 00000",
 F:"11111 10000 10000 11110 10000 10000 10000 00000",
 G:"01110 10001 10000 10111 10001 10001 01110 00000",
 H:"10001 10001 10001 11111 10001 10001 10001 00000",
 I:"01110 00100 00100 00100 00100 00100 01110 00000",
 J:"00111 00010 00010 00010 00010 10010 01100 00000",
 K:"10001 10010 10100 11000 10100 10010 10001 00000",
 L:"10000 10000 10000 10000 10000 10000 11111 00000",
 M:"10001 11011 10101 10101 10001 10001 10001 00000",
 N:"10001 11001 10101 10011 10001 10001 10001 00000",
 O:"01110 10001 10001 10001 10001 10001 01110 00000",
 P:"11110 10001 10001 11110 10000 10000 10000 00000",
 Q:"01110 10001 10001 10001 10101 10010 01101 00000",
 R:"11110 10001 10001 11110 10100 10010 10001 00000",
 S:"01111 10000 10000 01110 00001 00001 11110 00000",
 T:"11111 00100 00100 00100 00100 00100 00100 00000",
 U:"10001 10001 10001 10001 10001 10001 01110 00000",
 V:"10001 10001 10001 10001 10001 01010 00100 00000",
 W:"10001 10001 10001 10101 10101 10101 01010 00000",
 X:"10001 10001 01010 00100 01010 10001 10001 00000",
 Y:"10001 10001 01010 00100 00100 00100 00100 00000",
 Z:"11111 00001 00010 00100 01000 10000 11111 00000",
 a:"00000 00000 01110 00001 01111 10001 01111 00000",
 b:"10000 10000 10000 11110 10001 10001 11110 00000",
 c:"00000 00000 01110 10001 10000 10001 01110 00000",
 d:"00001 00001 00001 01111 10001 10001 01111 00000",
 e:"00000 00000 01110 10001 11111 10000 01110 00000",
 f:"00110 01001 01000 11100 01000 01000 01000 00000",
 g:"00000 00000 01111 10001 10001 01111 00001 01110",
 h:"10000 10000 10000 11110 10001 10001 10001 00000",
 i:"00100 00000 00100 00100 00100 00100 00100 00000",
 j:"00010 00000 00010 00010 00010 00010 10010 01100",
 k:"10000 10000 10010 10100 11000 10100 10010 00000",
 l:"01000 01000 01000 01000 01000 01000 01100 00000",
 m:"00000 00000 11111 10101 10101 10101 10101 00000",
 n:"00000 00000 11110 10001 10001 10001 10001 00000",
 o:"00000 00000 01110 10001 10001 10001 01110 00000",
 p:"00000 00000 11110 10001 10001 11110 10000 10000",
 q:"00000 00000 01111 10001 10001 01111 00001 00001",
 r:"00000 00000 11110 10010 10100 10000 10000 00000",
 s:"00000 00000 01111 10000 01110 00001 11110 00000",
 t:"01000 01000 11111 01000 01000 01000 01100 00000",
 u:"00000 00000 10001 10001 10001 10001 01111 00000",
 v:"00000 00000 10001 10001 10001 01010 00100 00000",
 w:"00000 00000 10001 10001 10101 10101 01010 00000",
 x:"00000 00000 10001 01010 00100 01010 10001 00000",
 y:"00000 00000 10001 10001 10001 01111 00001 01110",
 z:"00000 00000 11111 00010 00100 01000 11111 00000",
 "0":"01110 10001 10011 10101 11001 10001 01110 00000",
 "1":"00100 01100 00100 00100 00100 00100 01110 00000",
 "2":"01110 10001 00001 00010 00100 01000 11111 00000",
 "3":"01110 10001 00001 00110 00001 10001 01110 00000",
 "4":"00010 00110 01010 10010 11111 00010 00010 00000",
 "5":"11111 10000 11110 00001 00001 10001 01110 00000",
 "6":"00110 01000 10000 11110 10001 10001 01110 00000",
 "7":"11111 00001 00010 00100 01000 01000 01000 00000",
 "8":"01110 10001 10001 01110 10001 10001 01110 00000",
 "9":"01110 10001 10001 01111 00001 00010 01100 00000",
 ".":"00000 00000 00000 00000 00000 00000 00100 00000",
 ",":"00000 00000 00000 00000 00000 00100 01000 00000",
 "!":"00100 00100 00100 00100 00100 00000 00100 00000",
 "?":"01110 10001 00001 00110 00100 00000 00100 00000",
 ":":"00000 00000 00100 00000 00000 00100 00000 00000",
 "'":"00010 00010 00000 00000 00000 00000 00000 00000",
 "-":"00000 00000 00000 00000 01110 00000 00000 00000",
 "_":"00000 00000 00000 00000 00000 00000 00000 11111",
 "/":"00001 00001 00010 00100 01000 10000 10000 00000",
 "(":"00110 01000 01000 01000 01000 01000 00110 00000",
 ")":"01100 00010 00010 00010 00010 00010 01100 00000",
 "<":"00000 00010 00100 01000 00100 00010 00000 00000",
 ">":"00000 01000 00100 00010 00100 01000 00000 00000",
 "%":"11001 11001 00010 00100 01000 10011 10011 00000",
 "[":"01110 01000 01000 01000 01000 01000 01110 00000",
 "]":"01110 00010 00010 00010 00010 00010 01110 00000"
};

/* ================================================================
   2. THEME + PRIMITIVE LAYER — every screen draw goes through
       these. Port to M5GFX:  R->fillRect, FR->drawRect, L->drawLine,
       CIR->fillCircle, RING->drawCircle, ELL->fillEllipse,
       CHAM->fillRoundRect (or two chamfered fillRects).
   ================================================================ */
const K = {
  bg:"#000000", ink:"#eaf4f4", gray:"#7f8b90",
  cyan:"#30dcff", cyanMid:"#12a4bd", cyanDim:"#0d5462", faint:"#12333c",
  green:"#38d973", red:"#ff5347",
  botBody:"#08313a", botScreen:"#03141b", blobFill:"#17b0ca",
  pixHead:"#14a8c2", feat:"#04262c"
};

const lcd = document.getElementById("lcd");
const ctx = lcd.getContext("2d");
ctx.imageSmoothingEnabled = false;

function R(x,y,w,h,c){ w=Math.round(w); h=Math.round(h); if(w<=0||h<=0) return;
  ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function FR(x,y,w,h,c){ R(x,y,w,1,c); R(x,y+h-1,w,1,c); R(x,y,1,h,c); R(x+w-1,y,1,h,c); }
function P(x,y,c){ R(x,y,1,1,c); }
function L(x0,y0,x1,y1,c){                                  // Bresenham
  x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  let dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1, err=dx+dy;
  for(;;){ P(x0,y0,c); if(x0===x1&&y0===y1) break;
    const e2=2*err; if(e2>=dy){err+=dy; x0+=sx;} if(e2<=dx){err+=dx; y0+=sy;} }
}
function ELL(cx,cy,rx,ry,c){                                // scanline ellipse
  rx=Math.round(rx); ry=Math.round(ry); if(rx<=0||ry<=0) return;
  for(let dy=-ry; dy<=ry; dy++){
    const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry))));
    R(cx-hw, cy+dy, hw*2+1, 1, c);
  }
}
function CIR(cx,cy,r,c){ ELL(cx,cy,r,r,c); }
function RING(cx,cy,r,c){                                   // 1px circle outline
  r=Math.round(r); if(r<1) return;
  for(let dy=-r; dy<=r; dy++){ const dx=Math.round(Math.sqrt(r*r-dy*dy)); P(cx-dx,cy+dy,c); P(cx+dx,cy+dy,c); }
  for(let dx=-r; dx<=r; dx++){ const dy=Math.round(Math.sqrt(r*r-dx*dx)); P(cx+dx,cy-dy,c); P(cx+dx,cy+dy,c); }
}
function CHAMF(x,y,w,h,k,c){ R(x+k,y,w-2*k,h,c); R(x,y+k,w,h-2*k,c); }   // filled octagon
function CHAM(x,y,w,h,k,fill,edge){                          // chamfered rect + 1px frame
  CHAMF(x,y,w,h,k,edge); if(w>2&&h>2) CHAMF(x+1,y+1,w-2,h-2,Math.max(0,k-1),fill);
}

/* ---- text renderer: per-color glyph atlas, blitted 1:1 ---- */
const atlasCache = {};
function atlas(color){
  if(atlasCache[color]) return atlasCache[color];
  const cv=document.createElement("canvas"); cv.width=95*6; cv.height=8;
  const c2=cv.getContext("2d"); c2.fillStyle=color;
  for(const ch in FONT){
    const rows=FONT[ch].replace(/\s/g,""), code=ch.charCodeAt(0);
    for(let r=0;r<8;r++) for(let col=0;col<5;col++)
      if(rows[r*5+col]==="1") c2.fillRect((code-32)*6+col, r, 1, 1);
  }
  return atlasCache[color]=cv;
}
function txt(x,y,str,color,scale=1){
  const a=atlas(color);
  for(let i=0;i<str.length;i++){
    const code=str.charCodeAt(i);
    if(code>=32&&code<127)
      ctx.drawImage(a,(code-32)*6,0,5,8, Math.round(x+i*6*scale), Math.round(y), 5*scale, 8*scale);
  }
}
const txtW=(s,sc=1)=>s.length*6*sc-1;

/* ================================================================
   3. CONVERSATION SCRIPT + STATE
   ================================================================ */
const EX=[
  {you:"hey, what's the weather like?", ai:"it's sunny and 22 degrees. nice day for a walk!"},
  {you:"set a timer for five minutes",  ai:"ok! timer set for 5 minutes. i'll ping you."},
  {you:"tell me a robot joke",          ai:"why did the robot blink? to recharge its eyes!"},
  {you:"order me a pizza",              ai:"sorry, pizza skill is not installed yet.",
                                          err:"ERR: NET TIMEOUT", hint:"check wifi / signal"}
];

let state="idle", stateT=0, face="robot";
let T=0, cur=0, done=true, errShownFor=-2;
let revealed=0, revealAcc=0, wordIdx=0, wordAcc=0, speakDone=false, endAcc=0;
let recT=0, thinkDur=1.6;
let micEnv=0, micEnvT=0, micAcc=0, micBars=new Array(26).fill(0), micTgt=new Array(26).fill(0), peaks=new Array(26).fill(0);
let spkBars=[0,0,0,0,0], spkTgt=[0,0,0,0,0], spkAcc=0, mouth=0, mouthTgt=0, mouthAcc=0;
let blinkT=-1, blinkNext=1.5, sacX=0, sacY=0, sacNext=0;
let spaceHeld=false;

function setState(s){
  const prev=state; state=s; stateT=0;
  if(s==="listen"){
    recT=0; revealAcc=0;
    if(prev==="idle"||prev==="error"){
      if(done) cur=(cur+1)%EX.length;
      done=false; revealed=0;
    }
  }
  if(s==="think"){ thinkDur=1.2+Math.random()*0.8; revealed=1e9; }
  if(s==="speak"){ wordIdx=0; wordAcc=0; speakDone=false; endAcc=0; revealed=1e9; mouth=0; mouthTgt=0; }
  if(s==="error"){ errShownFor=cur; }
  updateKeys();
}
function nextExchange(){
  cur=(cur+1)%EX.length; done=true; revealed=0; wordIdx=0; speakDone=false;
  if(state!=="idle") setState("idle"); else updateKeys();
}
function talkDown(){
  bSpace.classList.add("held");
  if(state==="speak"){ done=true; setState("idle"); return; }        // barge-in / stop
  if(state==="idle"||state==="error") setState("listen");
}
function talkUp(){
  bSpace.classList.remove("held"); spaceHeld=false;
  if(state==="listen") setState("think");
}

/* ================================================================
   4. UPDATE — fake mic, fake ASR typing, karaoke timing, blinks
   ================================================================ */
function blinkAmt(){ if(blinkT<0) return 0; const ph=(T-blinkT)/0.22; return ph>=1?0:Math.sin(Math.PI*ph); }

function update(dt){
  stateT+=dt;

  if(state==="idle"||state==="speak"){
    if(blinkT<0 && T>=blinkNext) blinkT=T;
    if(blinkT>=0 && T-blinkT>0.22){ blinkT=-1; blinkNext=T+2.2+Math.random()*3.2; }
  } else blinkT=-1;

  if(state==="think" && T>=sacNext){                       // eye saccades
    sacNext=T+0.3+Math.random()*0.4;
    sacX=Math.round(Math.random()*8-4); sacY=Math.round(Math.random()*5-2.5);
  }

  if(state==="listen"){
    recT+=dt;
    micAcc+=dt;
    if(micAcc>0.12){ micAcc=0; micEnvT=0.3+Math.random()*0.7; for(let i=0;i<26;i++) micTgt[i]=Math.random(); }
    micEnv+=(micEnvT-micEnv)*Math.min(1,dt*7);
    const uw=EX[cur].you.split(" ");
    if(revealed<uw.length){                                // words "recognized" over time
      revealAcc+=dt;
      if(revealAcc>0.22+Math.random()*0.22){ revealAcc=0; revealed++; }
    }
    for(let i=0;i<26;i++){
      micBars[i]+=(micTgt[i]-micBars[i])*Math.min(1,dt*9);
      const v=Math.min(1,micBars[i]*micEnv*1.5);
      peaks[i]=Math.max(v, peaks[i]-dt*0.7);
    }
  } else {
    micEnv*=Math.max(0,1-dt*3);
    for(let i=0;i<26;i++) peaks[i]=Math.max(0,peaks[i]-dt*0.7);
  }

  if(state==="speak"){
    if(!speakDone){
      const wds=EX[cur].ai.split(" ");
      wordAcc+=dt;
      const dur=0.28+0.05*wds[wordIdx].length;
      if(wordAcc>=dur){
        wordAcc-=dur; wordIdx++;
        mouthTgt=Math.max(mouthTgt,0.7);                    // syllable burst on new word
        if(wordIdx>=wds.length){ speakDone=true; endAcc=0; }
      }
    } else {
      endAcc+=dt;
      if(endAcc>0.8){ done=true; setState("idle"); }
    }
    mouthAcc+=dt;
    if(mouthAcc>0.11){ mouthAcc=0; mouthTgt=speakDone?0:0.15+Math.random()*0.85; }
    mouth+=(mouthTgt-mouth)*Math.min(1,dt*16);
    spkAcc+=dt;
    if(spkAcc>0.09){ spkAcc=0; for(let i=0;i<5;i++) spkTgt[i]=Math.random(); }
    for(let i=0;i<5;i++) spkBars[i]+=(spkTgt[i]-spkBars[i])*Math.min(1,dt*10);
  } else mouth+=(0-mouth)*Math.min(1,dt*10);

  if(state==="think" && stateT>thinkDur)
    setState((EX[cur].err && errShownFor!==cur) ? "error" : "speak");
  if(state==="error" && stateT>4.2){ done=true; setState("idle"); }
}

/* ================================================================
   5. AVATARS — one shared "pose" (bob, blink, eye offset/height,
       mouth, rings, mood) consumed by three renderers.
       All fit a 64x64 box at screen x=4..68, y=28..92.
   ================================================================ */
function pose(){
  const p={bobX:0,bobY:0,eyeH:1,eyeX:0,eyeY:0,blink:blinkAmt(),mouth:0,rings:null,mood:state==="error"};
  if(state==="idle"){ p.bobY=Math.round(Math.sin(T*2.6)*2); p.eyeX=Math.sin(T*0.7)*2; p.eyeY=Math.sin(T*0.45+2)*1.5; }
  else if(state==="listen"){ p.eyeH=1.15+micEnv*0.45; p.bobY=Math.round(Math.sin(T*9)); p.rings=[(T*1.25)%1,(T*1.25+0.5)%1]; p.eyeY=-1; }
  else if(state==="think"){ p.eyeH=0.6; p.eyeX=sacX; p.eyeY=sacY; }
  else if(state==="speak"){ p.mouth=mouth; p.bobY=-Math.round(mouth*2); p.eyeX=Math.sin(T*1.3)*1.5; p.eyeY=Math.sin(T*0.9); }
  else if(state==="error"){
    p.bobY=2; p.eyeH=0.55;
    if(stateT<0.35) p.bobX=Math.round(Math.sin(stateT*55)*3*(1-stateT/0.35));   // entry shudder
  }
  return p;
}
function ringCol(ph){ return ph<0.3?K.cyan : ph<0.65?K.cyanMid : K.cyanDim; }
function drawRings(p){
  if(!p.rings) return;
  for(const ph of p.rings){
    if(face==="pixel"){ const hs=30+Math.round(4*ph); FR(36-hs,60-hs,hs*2,hs*2,ringCol(ph)); }
    else RING(36,60,26+Math.round(6*ph),ringCol(ph));
  }
}
function antColor(){
  if(state==="listen") return (Math.floor(T*2.5)%2)?K.red:"#40120d";
  if(state==="think")  return (Math.floor(T*4)%2)?K.cyan:K.cyanDim;
  if(state==="speak")  return K.green;
  if(state==="error")  return K.red;
  return (Math.sin(T*2.2)>0)?K.cyanMid:K.cyanDim;
}

/* ---- robot: chamfered head, antenna, EQ-bar mouth ---- */
function xEye(x,y){ L(x,y,x+7,y+7,K.red); L(x,y+1,x+7,y+8,K.red); L(x+7,y,x,y+7,K.red); L(x+7,y+1,x,y+8,K.red); }
function drawRobot(p){
  const ox=4+p.bobX, oy=28+p.bobY, ant=antColor();
  L(ox+32,oy+4,ox+32,oy+10,ant); CIR(ox+32,oy+3,2,ant);
  R(ox+4,oy+22,6,12,K.cyanMid); R(ox+54,oy+22,6,12,K.cyanMid);
  CHAM(ox+9,oy+10,46,38,5,K.botBody,K.cyan);
  R(ox+15,oy+16,34,26,K.botScreen); FR(ox+15,oy+16,34,26,K.faint);
  if(p.mood){
    xEye(ox+19,oy+20); xEye(ox+37,oy+20);
    L(ox+24,oy+37,ox+32,oy+33,K.red); L(ox+32,oy+33,ox+40,oy+37,K.red);
    L(ox+24,oy+38,ox+32,oy+34,K.red); L(ox+32,oy+34,ox+40,oy+38,K.red);
  } else {
    const eh=Math.max(2,Math.round(3+6*p.eyeH));
    if(p.blink>0.55){
      R(ox+19+p.eyeX,oy+23+p.eyeY,8,2,K.cyanMid); R(ox+37+p.eyeX,oy+23+p.eyeY,8,2,K.cyanMid);
    } else {
      R(ox+19+p.eyeX,oy+19+p.eyeY,8,eh,K.cyan); R(ox+37+p.eyeX,oy+19+p.eyeY,8,eh,K.cyan);
      R(ox+20+p.eyeX,oy+20+p.eyeY,2,2,K.ink);   R(ox+38+p.eyeX,oy+20+p.eyeY,2,2,K.ink);
    }
    for(let i=0;i<4;i++){                                   // mouth = 4 vent bars
      const jit=0.55+0.45*Math.sin(T*13+i*1.9);
      const h=2+Math.round(6*p.mouth*jit);
      R(ox+22+i*5,oy+39-h,4,h,p.mouth>0.05?K.cyan:K.cyanMid);
    }
    if(state==="think"){
      const n=1+Math.floor(stateT*3)%3;
      for(let i=0;i<n;i++) CIR(ox+40+i*6,oy+3,1,K.cyan);
    }
  }
}

/* ---- blob: squash-and-stretch ellipse, sprout, tear ---- */
function drawBlob(p){
  const ox=4+p.bobX, oy=28+p.bobY, cx=ox+32, cy=oy+38;
  let sq=Math.sin(T*2.6)*2;
  if(state==="listen") sq=Math.sin(T*10)*1.6;
  if(state==="speak")  sq=-p.mouth*2.5;
  let rx=21+sq, ry=19-sq;
  if(p.mood){ rx=23; ry=15; }
  const sway=p.mood?5:(state==="listen"?Math.sin(T*10)*2:Math.sin(T*2.6)*1.5);
  const sx=cx+Math.round(sway), topY=cy-ry;
  L(cx,topY+1,sx,topY-5,"#0b7590"); CIR(sx,topY-6,2,"#0b7590");   // sprout
  ELL(cx,cy,rx+1,ry+1,K.cyan); ELL(cx,cy,rx,ry,K.blobFill);
  const ey=cy-7;
  if(p.mood){
    L(cx-16,ey-4,cx-4,ey-8,K.feat); L(cx-16,ey-3,cx-4,ey-7,K.feat);
    L(cx+4,ey-8,cx+16,ey-4,K.feat); L(cx+4,ey-7,cx+16,ey-3,K.feat);
    ELL(cx-9,ey,5,4,K.ink); ELL(cx+9,ey,5,4,K.ink);
    ELL(cx-9,ey+1,2,2,K.feat); ELL(cx+9,ey+1,2,2,K.feat);
    const ty=ey+5+((T*16)%16);                                       // falling tear
    if(ty<cy+ry-4) R(cx-10,Math.round(ty),2,3,K.ink);
    L(cx-6,cy+8,cx,cy+5,K.feat); L(cx,cy+5,cx+6,cy+8,K.feat);
    L(cx-6,cy+9,cx,cy+6,K.feat); L(cx,cy+6,cx+6,cy+9,K.feat);
  } else {
    const wide=state==="listen", er=wide?6:5, pr=wide?1.6:2.2;
    const erY=Math.max(1.2,er*(1-0.9*p.blink));
    ELL(cx-9,ey,er,erY,K.ink); ELL(cx+9,ey,er,erY,K.ink);
    if(p.blink<0.5){
      const pxo=Math.round(Math.max(-2,Math.min(2,p.eyeX*0.5)));
      const pyo=Math.round(Math.max(-2,Math.min(2,p.eyeY*0.5))-(wide?1:0));
      ELL(cx-9+pxo,ey+pyo,pr,pr,K.feat); ELL(cx+9+pxo,ey+pyo,pr,pr,K.feat);
    }
    if(p.mouth>0.12) ELL(cx,cy+6,5+3*p.mouth,1+5*p.mouth,K.feat);
    else if(state==="think"){ L(cx-4,cy+7,cx+4,cy+7,K.feat); L(cx-4,cy+8,cx+4,cy+8,K.feat); }
    else{                                                              // smile
      L(cx-6,cy+4,cx,cy+6,K.feat); L(cx,cy+6,cx+6,cy+4,K.feat);
      L(cx-6,cy+5,cx,cy+7,K.feat); L(cx,cy+7,cx+6,cy+5,K.feat);
    }
  }
}

/* ---- pixel cat: 16x16 sprite grid, 4px cells ---- */
const HEAD=[
"................",
".##..........##.",
".###........###.",
".##############.",
".##############.",
".##############.",
".##############.",
".##############.",
".##############.",
".##############.",
".##############.",
".##############.",
".##############.",
".##############.",
"..############..",
"................"];
const headCache={};
function headCv(color){
  if(headCache[color]) return headCache[color];
  const cv=document.createElement("canvas"); cv.width=64; cv.height=64;
  const c=cv.getContext("2d"); c.fillStyle=color;
  HEAD.forEach((row,r)=>{
    let run=0;
    for(let x=0;x<=16;x++){
      const on=x<16&&row[x]==="#";
      if(on) run++;
      else{ if(run) c.fillRect((x-run)*4,r*4,run*4,4); run=0; }
    }
  });
  return headCache[color]=cv;
}
function drawPixel(p){
  const ox=4+p.bobX, oy=28+p.bobY;
  ctx.drawImage(headCv(p.mood?"#0e6d82":K.pixHead),ox,oy);
  const cell=(cx,cy,w,h,c)=>R(ox+cx*4,oy+cy*4,w*4,h*4,c);
  const dx=Math.round(p.eyeX/4), dy=Math.round(p.eyeY/4);
  if(p.mood){                                                     // X eyes + frown
    cell(3,5,1,1,K.red); cell(5,5,1,1,K.red); cell(4,6,1,1,K.red); cell(3,7,1,1,K.red); cell(5,7,1,1,K.red);
    cell(10,5,1,1,K.red); cell(12,5,1,1,K.red); cell(11,6,1,1,K.red); cell(10,7,1,1,K.red); cell(12,7,1,1,K.red);
    cell(7,10,2,1,K.feat); cell(6,11,1,1,K.feat); cell(9,11,1,1,K.feat);
  } else if(p.blink>0.5){
    cell(3+dx,7,2,1,K.feat); cell(11+dx,7,2,1,K.feat);
  } else if(state==="listen"){
    cell(3,5,2,3,K.feat); cell(11,5,2,3,K.feat);
    cell(3,5,1,1,K.ink); cell(11,5,1,1,K.ink);
  } else {
    cell(3+dx,6+dy,2,2,K.feat); cell(11+dx,6+dy,2,2,K.feat);
    cell(3+dx,6+dy,1,1,K.ink); cell(11+dx,6+dy,1,1,K.ink);
  }
  if(!p.mood){
    if(p.mouth>0.12){ const h=1+Math.round(2*p.mouth); cell(6,10,4,h,K.feat); }
    else if(state==="think"){ cell(7,11,2,1,K.feat); }
    else{ cell(6,11,2,1,K.feat); cell(9,11,2,1,K.feat); cell(8,12,1,1,K.feat); }  // cat mouth
  }
}
const AVATAR={robot:drawRobot, blob:drawBlob, pixel:drawPixel};

/* ================================================================
   6. SCREEN LAYOUT (all coordinates are true 240x135 pixels)
       header y0..25 | content y26..124 | footer y125..134
       avatar box x4..68 y28..92 | text column x76.. (26 cols)
       transcript: 38 cols x 3 lines at y97/107/117
   ================================================================ */
function fmtT(t){ const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); }

function drawHeader(){
  R(0,25,240,1,K.faint);
  for(let i=0;i<5;i++){                                          // live audio icon
    let h=[2,4,6,4,2][i], col=K.gray;
    if(state==="listen"){ h=2+Math.round(5*Math.min(1,micBars[i*5]*micEnv*1.5)); col=K.red; }
    else if(state==="speak"){ h=2+Math.round(5*Math.min(1,spkBars[i]*(0.3+0.7*mouth))); col=K.green; }
    else if(state==="think"){ h=2+Math.round(3*(0.5+0.5*Math.sin(T*4-i*1.1))); col=K.cyan; }
    else if(state==="error"){ h=2; col="#40120d"; }
    R(6+i*3,13-(h>>1),2,h,col);
  }
  txt(26,5,"VOICE",K.cyan,2);
  let s="IDLE", col=K.gray;
  if(state==="listen"){ s="REC "+fmtT(recT); col=K.red; }
  else if(state==="think"){ s="BUSY"; col=K.cyan; }
  else if(state==="speak"){ s="PLAY"; col=K.green; }
  else if(state==="error"){ s="ERR!"; col=K.red; }
  const x=234-txtW(s);
  txt(x,9,s,col);
  if(state==="listen"&&Math.floor(T*2.5)%2===0) R(x-8,11,4,4,K.red);
}

function drawRightCol(){
  const x=76;
  if(state==="idle"){
    txt(x,49,"hold SPACE to talk",K.ink);
    if(Math.floor(T*1.9)%2===0) R(x+110,49,4,8,K.ink);            // block cursor
    txt(x,63,"say something nice.",K.gray);
  }
  else if(state==="listen"){
    if(Math.floor(T*2.5)%2===0) R(x,31,4,4,K.red);
    txt(x+9,30,"listening",K.ink);
    const mid=56;
    for(let i=0;i<26;i++){                                        // mirrored waveform
      const v=Math.min(1,micBars[i]*micEnv*1.5);
      const h=2+Math.round(11*v);
      R(x+i*6,mid-h,4,h*2,K.cyan);
      const pk=2+Math.round(11*Math.min(1,peaks[i]));
      if(pk>h) R(x+i*6,mid-pk,4,1,K.gray);                        // peak-hold caps
    }
    txt(x,78,"release SPACE to send",K.gray);
  }
  else if(state==="think"){
    for(let i=0;i<8;i++){ const a=i*Math.PI/4;                    // orbit spinner
      P(81+Math.round(Math.cos(a)*4),34+Math.round(Math.sin(a)*4),K.cyanDim); }
    const a=(Math.floor(T*8)%8)*Math.PI/4;
    R(80+Math.round(Math.cos(a)*4),33+Math.round(Math.sin(a)*4),2,2,K.cyan);
    txt(92,30,"thinking",K.ink);
    const n=1+Math.floor(stateT*3)%3;
    for(let i=0;i<n;i++) R(143+i*5,32,3,3,K.cyan);                // animated dots
    txt(x,78,"waiting for server",K.gray);
  }
  else if(state==="speak"){
    txt(x,30,"speaking",K.green);
    for(let i=0;i<5;i++){                                         // green VU
      const h=2+Math.round(16*Math.min(1,spkBars[i]*(0.25+0.75*mouth)));
      R(x+i*30,68-h,22,h,K.green);
    }
    txt(x,78,"press SPACE to stop",K.gray);
  }
  else{
    const ex=EX[cur];
    txt(x,30,ex.err||"ERR: NET TIMEOUT",K.red);
    txt(x,44,ex.hint||"check wifi / signal",K.gray);
    txt(x,78,"hold SPACE to retry",K.gray);
  }
}

/* ---- transcript: "you:" / "ai:" wrapped to 38 cols, karaoke ---- */
function chatTokens(){
  const ex=EX[cur], toks=[{t:"you:",cls:"lbl"}];
  const uw=ex.you.split(" ");
  const n=state==="listen"?Math.min(revealed,uw.length):uw.length;
  for(let i=0;i<n;i++) toks.push({t:uw[i],cls:"you",wi:i});
  if(state!=="listen"){
    toks.push({t:"ai:",cls:"lbl",br:true});
    if(state==="error") for(const w of "[connection lost]".split(" ")) toks.push({t:w,cls:"err"});
    else if(state!=="think"){ const aw=ex.ai.split(" "); for(let i=0;i<aw.length;i++) toks.push({t:aw[i],cls:"ai",wi:i}); }
  }
  return toks;
}
function drawTranscript(){
  R(4,94,232,1,K.faint);                                          // zone separator
  let col=0, ln=0, lastUser=null;
  for(const tk of chatTokens()){
    if(tk.br){ ln++; col=0; }
    if(col>0 && col+1+tk.t.length>38){ ln++; col=0; }
    const start=col===0?0:col+1;
    const x=4+start*6, y=97+ln*10;
    if(ln<=2){
      let color = tk.cls==="lbl"?K.gray : tk.cls==="err"?K.red : tk.cls==="you"?K.ink : K.cyan;
      let boxed=false;
      if(tk.cls==="ai"&&state==="speak"){
        if(tk.wi===wordIdx) boxed=true;
        else color = tk.wi<wordIdx?K.ink:K.cyan;                  // spoken words turn white
      }
      if(boxed){ R(x-1,y-1,tk.t.length*6+1,10,K.ink); txt(x,y,tk.t,"#000"); }
      else txt(x,y,tk.t,color);
      if(tk.cls==="think-dots"){}
      if(tk.cls==="lbl"&&tk.t==="ai:"&&state==="think"){
        const n=1+Math.floor(stateT*3)%3;
        for(let i=0;i<n;i++) R(x+22+i*5,y+3,3,3,K.cyan);
      }
      if(tk.cls==="you"||tk.t==="you:") lastUser={x,y,end:x+tk.t.length*6};
    }
    col=start+tk.t.length;
  }
  if(state==="listen"&&lastUser&&Math.floor(T*2.2)%2===0)         // ASR caret
    R(Math.min(lastUser.end+2,230),lastUser.y,4,8,K.ink);
}

function drawFooter(){
  R(0,125,240,1,K.faint);
  txt(4,126,"Q: back",K.gray);
  const nc=state==="error"?K.red:K.green;                         // wifi
  R(170,129,2,4,nc); R(173,127,2,6,nc); R(176,126,2,7,nc);
  txt(182,126,state==="error"?"--":"ok",nc);
  txt(197,126,"78%",K.gray);                                      // battery
  FR(223,127,10,6,K.gray); R(233,129,2,2,K.gray); R(224,128,6,4,K.green);
}

function render(){
  ctx.fillStyle=K.bg; ctx.fillRect(0,0,240,135);
  drawHeader();
  drawRightCol();
  const p=pose();
  drawRings(p);
  AVATAR[face](p);
  drawTranscript();
  drawFooter();
}

/* ================================================================
   7. INPUT — keycaps + real keyboard + hold-the-screen
   ================================================================ */
const bSpace=document.getElementById("bSpace");
const bNext=document.getElementById("bNext");
const stateKeys={"1":"idle","2":"listen","3":"think","4":"speak","5":"error"};
const faceKeys={"r":"robot","b":"blob","p":"pixel"};

function updateKeys(){
  document.querySelectorAll(".k[data-state]").forEach(b=>b.classList.toggle("on",b.dataset.state===state));
  document.querySelectorAll(".k[data-face]").forEach(b=>b.classList.toggle("on",b.dataset.face===face));
}
function setFace(f){ face=f; updateKeys(); }

document.querySelectorAll(".k[data-state]").forEach(b=>
  b.addEventListener("click",()=>{ setState(b.dataset.state); b.blur(); }));
document.querySelectorAll(".k[data-face]").forEach(b=>
  b.addEventListener("click",()=>{ setFace(b.dataset.face); b.blur(); }));
bNext.addEventListener("click",()=>{ nextExchange(); bNext.blur(); });

bSpace.addEventListener("pointerdown",e=>{ e.preventDefault(); spaceHeld=true; talkDown(); });
lcd.addEventListener("pointerdown",e=>{ e.preventDefault(); spaceHeld=true; talkDown(); });
window.addEventListener("pointerup",()=>{ if(spaceHeld) talkUp(); });
lcd.addEventListener("contextmenu",e=>e.preventDefault());
bSpace.addEventListener("contextmenu",e=>e.preventDefault());

window.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); if(!e.repeat){ spaceHeld=true; talkDown(); } return; }
  if(e.repeat) return;
  const k=e.key.toLowerCase();
  if(stateKeys[k]) setState(stateKeys[k]);
  else if(faceKeys[k]) setFace(faceKeys[k]);
  else if(k==="n") nextExchange();
});
window.addEventListener("keyup",e=>{
  if(e.code==="Space"){ e.preventDefault(); if(spaceHeld) talkUp(); }
});

/* ================================================================
   8. MAIN LOOP
   ================================================================ */
updateKeys();
let last=0;
requestAnimationFrame(function frame(ts){
  const t=ts/1000, dt=Math.min(0.05,t-last||0.016);
  last=t; T+=dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
});
})();
</script>
