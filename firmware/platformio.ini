; cardputer-voice firmware — M5Stack Cardputer (ESP32-S3)
; https://docs.platformio.org/en/stable/boards/espressif32/m5stack-stamps3.html
;
; Board notes:
; - m5stack-stamps3 is the StampS3 module inside the original Cardputer.
;   The M5Cardputer library auto-detects the Adv revision at runtime, so this
;   one build targets both. (Generic fallback: board = esp32-s3-devkitc-1.)
; - ARDUINO_USB_CDC_ON_BOOT / ARDUINO_USB_MODE follow the official M5Stack
;   Cardputer PlatformIO configuration and expose Serial over USB CDC.

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unified@^0.2.19
    m5stack/M5GFX@^0.2.26
    bblanchon/ArduinoJson@^7.0.0
